name: Read image targets
description: Load the job matrix from the enabled image recipes
outputs:
  matrix:
    description: Enabled target matrix
    value: ${{ steps.targets.outputs.matrix }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
    - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
      with:
        version: 3.46.4
        repo-token: ${{ github.token }}
    - shell: bash
      run: task install
    - id: targets
      shell: bash
      run: echo "matrix=$(task --silent targets:matrix)" >> "$GITHUB_OUTPUT"
