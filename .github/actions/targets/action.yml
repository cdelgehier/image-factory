name: Read image targets
description: Load the job matrix from the enabled image recipes
inputs:
  base-ref:
    description: Compare image inputs with this Git reference; empty builds all targets
    default: ""
  head-ref:
    description: Commit to compare with the base reference
    default: HEAD
outputs:
  matrix:
    description: Enabled target matrix
    value: ${{ steps.targets.outputs.matrix }}
  has_targets:
    description: Whether the selected matrix includes a public image
    value: ${{ steps.targets.outputs.has_targets }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
    - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
      with:
        version: 3.46.4
        repo-token: ${{ github.token }}
    - shell: bash
      run: task install
    - id: targets
      shell: bash
      run: |
        matrix="$(task --silent targets:matrix)"
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        uv run --locked python -c 'import json, sys; print("has_targets=" + str(bool(json.loads(sys.argv[1])["target"])).lower())' "$matrix" >> "$GITHUB_OUTPUT"
      env:
        IMAGE_FACTORY_BASE_REF: ${{ inputs.base-ref }}
        IMAGE_FACTORY_HEAD_REF: ${{ inputs.head-ref }}
