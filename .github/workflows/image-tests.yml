name: Image tests
on:
  pull_request:
  workflow_dispatch:
    inputs:
      report_sha:
        description: Source pull request commit to report
        type: string
        default: ""
      ref:
        description: Commit or branch to build and test
        type: string
        default: main
  workflow_call:
    inputs:
      report_sha:
        type: string
        default: ""
      ref:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/targets
        id: targets
  box:
    needs: targets
    name: Box tests (${{ matrix.target }})
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task box:build "TARGET=$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
      - run: task test:box "TARGET=$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diagnostics-${{ matrix.target }}
          path: |
            reports/**/*.log
            dist/**/*.xml
            dist/**/*.json
            dist/**/*.sha256
          retention-days: 14
  source-status:
    needs: [targets, box]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.report_sha != ''
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report the source pull request result
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ inputs.report_sha }}
          RESULT: ${{ needs.box.result }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$REPORT_SHA" =~ ^[0-9a-f]{40}$ ]]
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api "repos/$REPOSITORY/statuses/$REPORT_SHA" -f "state=$state" \
            -f 'context=Box tests' -f "target_url=$RUN_URL"
