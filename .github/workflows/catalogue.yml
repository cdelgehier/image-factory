name: Vagrant catalogue
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/catalogue.yml
      - .github/catalogue.Taskfile.yml
      - image_factory/catalogue.py
      - image_factory/catalogue_site.py
permissions:
  contents: read
concurrency:
  group: vagrant-catalogue
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          version: 3.46.4
          repo-token: ${{ github.token }}
      - run: task install
      - name: Read the latest published catalogues
        run: task --taskfile .github/catalogue.Taskfile.yml prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .build/catalogue
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy
      - name: Check the public URLs used by Vagrant
        run: task --taskfile .github/catalogue.Taskfile.yml verify
