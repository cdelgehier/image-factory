name: Published box audit
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-box-audit
  cancel-in-progress: false
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/targets
        id: targets
  audit:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/targets
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.1.4
      - name: Install disk validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils
      - name: Audit the public catalogue and downloaded release files
        run: task release:audit "TARGET=$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
