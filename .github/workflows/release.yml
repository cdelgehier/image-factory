name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable SemVer tag to build and publish
        required: true
        type: string
permissions:
  contents: read
  statuses: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/targets
        id: targets
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
  build:
    needs: [checks, targets]
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - name: Validate the release tag
        shell: bash
        run: '[[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
        env:
          TAG: ${{ inputs.tag }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task box:build "TARGET=$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
      - run: task test:box "TARGET=$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Save tested release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/**/*.box
            dist/**/*.sha256
            dist/**/*.json
            dist/**/*.xml
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Save release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostics-${{ inputs.tag }}-${{ matrix.target }}
          path: |
            reports/**/*.log
            dist/**/*.xml
            dist/**/*.json
            dist/**/*.sha256
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/targets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true
      - name: Publish the tested draft
        run: task release:publish "TAG=$TAG"
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
