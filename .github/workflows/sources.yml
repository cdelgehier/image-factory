name: Source updates
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write
concurrency:
  group: source-updates
  cancel-in-progress: false
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/targets
        id: targets
  update:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2
        with:
          version: 3.46.4
          repo-token: ${{ github.token }}
      - run: task install
      - run: task sources:update "TARGET=$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        id: pull-request
        with:
          branch: updates/${{ matrix.target }}-source
          commit-message: "fix(source): update the ${{ matrix.target }} image"
          title: "fix(source): update the ${{ matrix.target }} image"
          body: "Update the pinned official source within this target release. The image workflows validate the checksum and test the final box."
          add-paths: targets/${{ matrix.target }}/source.pkrvars.json
          delete-branch: true
      - name: Start checks for the source pull request
        if: steps.pull-request.outputs.pull-request-operation == 'created' || steps.pull-request.outputs.pull-request-operation == 'updated'
        run: |
          for context in 'Code checks' 'Box tests'; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=pending -f "context=$context"
          done
          gh workflow run checks.yml --ref main -f "ref=$HEAD" -f "report_sha=$HEAD"
          gh workflow run image-tests.yml --ref main -f "ref=$HEAD" -f "report_sha=$HEAD" -f base_ref=main
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pull-request.outputs.pull-request-head-sha }}
