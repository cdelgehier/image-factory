version: "3"

env:
  IMAGE_FACTORY_TARGET: '{{.TARGET | default ""}}'

tasks:
  install:
    desc: Install the locked Python tools
    cmd: uv sync --locked
  ci:
    desc: Run configuration, code and unit checks
    cmds:
      - task: install
      - task: lint
      - task: fmt:check
      - task: type:check
      - task: test:py
      - task: shell:check
      - task: packer:validate
      - task: workflows:check
  lint:
    cmd: uv run --locked ruff check image_factory scripts targets tests
  fmt:check:
    cmd: uv run --locked ruff format --check image_factory scripts targets tests
  fmt:fix:
    cmd: uv run --locked ruff format image_factory scripts targets tests
  type:check:
    cmd: uv run --locked ty check image_factory scripts targets tests
  test:py:
    cmd: uv run --locked pytest tests/unit targets/*/tests/unit --cov=image_factory --cov=scripts --cov=targets --cov-report=term-missing --junitxml=reports/unit-tests.xml
  shell:check:
    cmds:
      - shellcheck scripts/*.sh targets/*/*.sh
      - shfmt -d -i 2 scripts/*.sh targets/*/*.sh
  packer:validate:
    cmd: bash scripts/validate.sh
  workflows:check:
    cmd: actionlint
  sources:update:
    desc: Update the official source of the selected target
    cmd: uv run --locked python -m image_factory.sources
  box:build:
    desc: Build the selected disk and box with TCG
    cmd: bash scripts/build.sh
  test:box:
    desc: Test the final archive and two Vagrant clones
    cmd: uv run --locked python -m image_factory.targets test
  targets:matrix:
    desc: List enabled targets for GitHub job matrices
    cmd: uv run --locked python -m image_factory.targets matrix
  release:
    desc: Dispatch the tested release workflow for a SemVer tag
    requires:
      vars: [TAG]
    cmd: uv run --locked python -m image_factory.release dispatch {{shellQuote .TAG}}
  release:draft:
    requires:
      vars: [TAG]
    cmd: uv run --locked python -m image_factory.release draft {{shellQuote .TAG}}
  release:publish:
    requires:
      vars: [TAG]
    cmd: uv run --locked python -m image_factory.release publish {{shellQuote .TAG}}
  version:bump:
    cmd: bash scripts/version.sh
  pre-commit:install:
    cmds:
      - uv run --locked pre-commit install
      - uv run --locked pre-commit install --hook-type commit-msg
