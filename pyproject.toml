[project]
name = "image-factory"
version = "0.4.0"
description = "ARM64 Vagrant boxes built and tested on GitHub Actions."
requires-python = ">=3.14"
dependencies = ["pydantic>=2.12.0"]

[dependency-groups]
dev = [
  "commitizen>=4.16.3",
  "pre-commit>=4.0.0",
  "pytest>=8.0.0",
  "pytest-cov>=6.0.0",
  "pytest-testinfra>=10.0.0",
  "ruff>=0.15.15",
  "ty>=0.0.1",
]

[tool.uv]
package = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
version_files = ["pyproject.toml:^version"]
bump_message = "chore(release): bump version $current_version -> $new_version"
pre_bump_hooks = ["uv lock"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "targets"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.coverage.run]
omit = ["*/tests/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
